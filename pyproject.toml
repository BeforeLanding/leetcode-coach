[project]
name = "taolu"
version = "0.0.1"
description = "LeetCode 刷题教练：分层提示、套路卡与间隔复习"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
taolu = "taolu.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
